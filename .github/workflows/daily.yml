name: TradingBro daily

# All times IST (UTC+5:30), Monday-Friday. NSE holidays are skipped inside the script.
on:
  schedule:
    - cron: "40 4 * * 1-5"    # 10:10 IST - scan stocks, futures, options; commit picks
    - cron: "0 8 * * 1-5"     # 13:30 IST - provisional check -> output/<date>/review_1330.*
    - cron: "10 10 * * 1-5"   # 15:40 IST - final review + Result.md
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        type: choice
        options: [scan, midday, final, results]
        default: scan
      force:
        description: "Run even if today is not a trading day"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tradingbro-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPITAL: ${{ vars.CAPITAL || '100000' }}
      FORCE: ${{ inputs.force && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Choose job
        id: job
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ inputs.job }}"
          else
            case "${{ github.event.schedule }}" in
              "40 4 * * 1-5") JOB=scan ;;
              "0 8 * * 1-5")  JOB=midday ;;
              *)              JOB=final ;;
            esac
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Running job: $JOB"

      - name: Run
        run: python -m tradingbro.daily ${{ steps.job.outputs.job }}

      - name: Commit results
        run: |
          git config user.name "swaraj-prabhakar"
          git config user.email "98304110+swaraj-prabhakar@users.noreply.github.com"
          git add output Result.md 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "${{ steps.job.outputs.job }}: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 10
          done
          exit 1
