name: TradingBro daily

# All times IST (UTC+5:30), Monday-Friday. NSE holidays are skipped inside the script.
# Schedule: GitHub often starts scheduled runs late (5-10 hours on 24 Nov 2026), so there are many
# triggers and every one runs `daily auto`, which does whatever is due right now and each step only
# once a day: the scan inside 09:45-13:30, the mid-day check 13:30-15:35, the final review after
# 15:35 (or after midnight for the previous session). Extra runs just print "nothing to do".
# For on-time runs, also call workflow_dispatch with job=auto from an external scheduler (README).
on:
  schedule:
    - cron: "40 4 * * 1-5"        # 10:10 IST - scan window
    - cron: "7 5 * * 1-5"         # 10:37 IST - scan window
    - cron: "37 5 * * 1-5"        # 11:07 IST - scan window
    - cron: "7 6 * * 1-5"         # 11:37 IST - scan window
    - cron: "37 6 * * 1-5"        # 12:07 IST - scan window
    - cron: "7 7 * * 1-5"         # 12:37 IST - scan window
    - cron: "37 7 * * 1-5"        # 13:07 IST - scan window
    - cron: "3 8 * * 1-5"         # 13:33 IST - mid-day check
    - cron: "33 8 * * 1-5"        # 14:03 IST - mid-day check
    - cron: "3 9 * * 1-5"         # 14:33 IST - mid-day check
    - cron: "33 9 * * 1-5"        # 15:03 IST - mid-day check
    - cron: "10 10 * * 1-5"       # 15:40 IST - final review
    - cron: "40 10 * * 1-5"       # 16:10 IST - final review
    - cron: "13 11 * * 1-5"       # 16:43 IST - final review
    - cron: "13 12 * * 1-5"       # 17:43 IST - final review
    - cron: "13 14 * * 1-5"       # 19:43 IST - final review
    - cron: "13 17 * * 1-5"       # 22:43 IST - final review
    - cron: "13 20 * * 1-5"       # 01:43 next day IST - final review
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        type: choice
        options: [auto, scan, midday, final, results, picks]
        default: auto
      force:
        description: "Run even if today is not a trading day"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tradingbro-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPITAL: ${{ vars.CAPITAL || '100000' }}
      FORCE: ${{ inputs.force && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Choose job
        id: job
        run: |
          JOB="${{ inputs.job }}"
          if [ -z "$JOB" ]; then JOB=auto; fi          # every scheduled run is `auto`
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Running job: $JOB"

      - name: Run
        run: python -m tradingbro.daily ${{ steps.job.outputs.job }}

      - name: Run personal (top 2 per segment, capital split, P&L per segment)
        continue-on-error: true     # never blocks the main results
        env:
          TRADINGBRO_PROFILE: personal
          TRADINGBRO_CACHE_TTL: "1800"   # same bars as the main scan above
        run: |
          JOB=${{ steps.job.outputs.job }}
          if [ "$JOB" != compare ]; then python -m tradingbro.daily $JOB; fi

      - name: Commit results
        run: |
          git config user.name "swaraj-prabhakar"
          git config user.email "98304110+swaraj-prabhakar@users.noreply.github.com"
          # add each path separately: one missing path makes a single `git add` add nothing at all
          for p in output Result.md Picks.md output_personal Result_personal.md Picks_personal.md; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "${{ steps.job.outputs.job }}: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 10
          done
          exit 1
