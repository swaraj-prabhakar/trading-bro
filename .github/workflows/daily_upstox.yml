name: TradingBro daily

# Scan, mid-day check and final review on Upstox market data (the only data source since 26 Nov 2026).
# Writes output_upstox/, Result_upstox.md, Picks_upstox.md and the personal (_personal) versions.
# All times IST (UTC+5:30), Monday-Friday. NSE holidays are skipped inside the script.
#
# Optional: add the free 1-year Upstox "Analytics Token" as the repository secret
# UPSTOX_ANALYTICS_TOKEN (Settings > Secrets and variables > Actions). The candle API
# currently works without it; the token keeps the data flowing if Upstox starts requiring auth.
# Schedule: GitHub often starts scheduled runs late (5-10 hours on 24 Nov 2026), so there are many
# triggers and every one runs `daily auto`, which does whatever is due right now and each step only
# once a day: the scan inside 09:45-13:30, the mid-day check 13:30-15:35, the final review after
# 15:35 (or after midnight for the previous session). Extra runs just print "nothing to do".
# For on-time runs, also call workflow_dispatch with job=auto from an external scheduler (README).
on:
  schedule:
    - cron: "42 4 * * 1-5"        # 10:12 IST - scan window
    - cron: "9 5 * * 1-5"         # 10:39 IST - scan window
    - cron: "39 5 * * 1-5"        # 11:09 IST - scan window
    - cron: "9 6 * * 1-5"         # 11:39 IST - scan window
    - cron: "39 6 * * 1-5"        # 12:09 IST - scan window
    - cron: "9 7 * * 1-5"         # 12:39 IST - scan window
    - cron: "39 7 * * 1-5"        # 13:09 IST - scan window
    - cron: "5 8 * * 1-5"         # 13:35 IST - mid-day check
    - cron: "35 8 * * 1-5"        # 14:05 IST - mid-day check
    - cron: "5 9 * * 1-5"         # 14:35 IST - mid-day check
    - cron: "35 9 * * 1-5"        # 15:05 IST - mid-day check
    - cron: "12 10 * * 1-5"       # 15:42 IST - final review
    - cron: "42 10 * * 1-5"       # 16:12 IST - final review
    - cron: "15 11 * * 1-5"       # 16:45 IST - final review
    - cron: "15 12 * * 1-5"       # 17:45 IST - final review
    - cron: "15 14 * * 1-5"       # 19:45 IST - final review
    - cron: "15 17 * * 1-5"       # 22:45 IST - final review
    - cron: "15 20 * * 1-5"       # 01:45 next day IST - final review
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        type: choice
        options: [auto, scan, midday, final, results, picks]
        default: auto
      force:
        description: "Run even if today is not a trading day"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tradingbro-daily-upstox
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPITAL: ${{ vars.CAPITAL || '100000' }}
      FORCE: ${{ inputs.force && '1' || '0' }}
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Choose job
        id: job
        run: |
          JOB="${{ inputs.job }}"
          if [ -z "$JOB" ]; then JOB=auto; fi          # every scheduled run is `auto`
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Running job: $JOB"

      - name: Run
        run: python -m tradingbro.daily ${{ steps.job.outputs.job }}

      - name: Run personal (top 2 per segment, capital split, P&L per segment)
        continue-on-error: true     # never blocks the main results
        env:
          TRADINGBRO_PROFILE: personal
          TRADINGBRO_CACHE_TTL: "1800"   # same bars as the main scan above
        run: python -m tradingbro.daily ${{ steps.job.outputs.job }}

      - name: Commit results
        run: |
          git config user.name "swaraj-prabhakar"
          git config user.email "98304110+swaraj-prabhakar@users.noreply.github.com"
          # add each path separately: one missing path makes a single `git add` add nothing at all
          for p in output_upstox Result_upstox.md Picks_upstox.md output_upstox_personal Result_upstox_personal.md Picks_upstox_personal.md; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "${{ steps.job.outputs.job }}: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 10
          done
          exit 1
