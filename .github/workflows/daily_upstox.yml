name: TradingBro daily (Upstox data)

# Same strategies and scan times as "TradingBro daily", but on Upstox market data.
# Everything is written separately: output_upstox/, Result_upstox.md, Picks_upstox.md,
# plus Compare.md (Yahoo vs Upstox). All times IST (UTC+5:30), Monday-Friday.
#
# Optional: add the free 1-year Upstox "Analytics Token" as the repository secret
# UPSTOX_ANALYTICS_TOKEN (Settings > Secrets and variables > Actions). The candle API
# currently works without it; the token keeps the data flowing if Upstox starts requiring auth.
on:
  schedule:
    - cron: "40 4 * * 1-5"    # 10:10 IST - scan (same minute as the Yahoo scan, for a fair comparison)
    - cron: "0 8 * * 1-5"     # 13:30 IST - provisional check
    - cron: "25 10 * * 1-5"   # 15:55 IST - final review + Result_upstox.md + Compare.md
                              #             (after the Yahoo 15:40 review, so Compare.md has both)
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        type: choice
        options: [scan, midday, final, results, picks, compare]
        default: scan
      force:
        description: "Run even if today is not a trading day"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tradingbro-daily-upstox
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPITAL: ${{ vars.CAPITAL || '100000' }}
      FORCE: ${{ inputs.force && '1' || '0' }}
      TRADINGBRO_SOURCE: upstox
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Choose job
        id: job
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ inputs.job }}"
          else
            case "${{ github.event.schedule }}" in
              "40 4 * * 1-5") JOB=scan ;;
              "0 8 * * 1-5")  JOB=midday ;;
              *)              JOB=final ;;
            esac
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Running job: $JOB"

      - name: Run
        run: python -m tradingbro.up daily ${{ steps.job.outputs.job }}

      - name: Run personal (top 2 per segment, capital split, P&L per segment)
        continue-on-error: true     # never blocks the main results
        env:
          TRADINGBRO_PROFILE: personal
          TRADINGBRO_CACHE_TTL: "1800"   # same bars as the main scan above
        run: |
          JOB=${{ steps.job.outputs.job }}
          if [ "$JOB" != compare ]; then python -m tradingbro.up daily $JOB; fi

      - name: Compare with the Yahoo pipeline
        if: steps.job.outputs.job == 'final' || steps.job.outputs.job == 'compare'
        run: |
          git pull --rebase --autostash || true    # pick up the Yahoo workflow's 15:40 review
          python -m tradingbro.up daily compare
          TRADINGBRO_PROFILE=personal python -m tradingbro.up daily compare || true   # -> Compare_personal.md

      - name: Commit results
        run: |
          git config user.name "swaraj-prabhakar"
          git config user.email "98304110+swaraj-prabhakar@users.noreply.github.com"
          # add each path separately: one missing path makes a single `git add` add nothing at all
          for p in output_upstox Result_upstox.md Picks_upstox.md Compare.md output_upstox_personal Result_upstox_personal.md Picks_upstox_personal.md Compare_personal.md; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "upstox ${{ steps.job.outputs.job }}: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 10
          done
          exit 1
